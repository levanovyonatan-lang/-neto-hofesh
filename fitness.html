<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6DYJ3S4PW0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-6DYJ3S4PW0');

        window.trackEvent = function(eventName, params = {}) {
            if (typeof gtag === 'function') {
                gtag('event', eventName, Object.assign({}, params, { transport: 'beacon' }));
            }
        };

        window.addEventListener('DOMContentLoaded', function() {
            window.trackEvent('view_avigail_camp_page');
        });
    </script>

    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>קייטנת אקשן עם אביגיל</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-purple: #007BFF;
            --brand-purple-dark: #0056b3;
            --whatsapp-green: #25D366;
            --whatsapp-green-dark: #1da851;
            --text-dark: #1A1A2E;
            --text-light: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        a, button, .btn, .close-btn, #play-overlay {
            touch-action: manipulation;
        }

        html {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: #010a18;
            color: var(--text-dark);
            width: 100%;
            max-width: 100vw;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Animated Glowing Orbs Background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            z-index: -1;
            animation: floatOrb 10s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 300px;
            height: 300px;
            background: #0ea5e9;
            top: -10%;
            left: -20%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 250px;
            height: 250px;
            background: #3b82f6;
            bottom: 20%;
            right: -10%;
            animation-delay: -3s;
        }
        .orb-3 {
            width: 200px;
            height: 200px;
            background: #1d4ed8;
            top: 40%;
            left: 20%;
            animation-delay: -6s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -40px) scale(1.2); }
        }

        /* Video Hero Section */
        .video-container {
            width: calc(56vh * (9 / 16));
            max-width: 90%;
            height: 56vh; 
            background-color: #000;
            position: relative;
            box-shadow: 0 15px 45px rgba(14, 165, 233, 0.3), 0 0 20px rgba(59, 130, 246, 0.2);
            border-radius: 24px;
            overflow: hidden;
            margin: 25px auto 0 auto;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.15);
            animation: dropIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(-20px);
            z-index: 2;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes dropIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Content Section - Glassmorphism */
        .content-container {
            flex: 1 0 auto;
            width: 100%;
            max-width: 450px; 
            padding: 20px 20px calc(30px + env(safe-area-inset-bottom, 20px));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 12px;
            
            /* Glassmorphism Effect */
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,255,255,0.8);
            
            border-radius: 35px 35px 0 0;
            margin: -20px auto 0 auto; /* Ensure centered in Safari */
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
            z-index: 10;
            
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Badge */
        .badge {
            background: linear-gradient(90deg, #0ea5e9, #3b82f6);
            color: white;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
            display: inline-flex;
            align-items: center;
            direction: rtl;
            flex-direction: row;
            margin-bottom: -5px;
            gap: 8px;
        }

        /* FOMO Text */
        .fomo-text {
            font-size: 1.4rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 15px;
            
            /* Gradient Text */
            background: linear-gradient(135deg, #1A1A2E, #6A1CB3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 20px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 800;
            text-decoration: none;
            transition: all 0.1s ease;
            position: relative;
            overflow: hidden;
            direction: rtl;
            flex-direction: row;
            gap: 12px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* Primary CTA (WhatsApp) */
        .btn-whatsapp {
            background: linear-gradient(90deg, var(--whatsapp-green), #28E16E);
            color: white;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
            border: none;
        }

        /* Animated Shine on WhatsApp Button */
        .btn-whatsapp::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: skewX(-20deg);
            animation: shine 4s infinite cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .whatsapp-icon {
            width: 26px;
            height: 26px;
            margin: 0;
            fill: currentColor;
        }

        /* Secondary CTA (Registration) */
        .btn-registration {
            background: linear-gradient(135deg, #7F00FF, #3b0a70);
            color: white;
            border: none;
            box-shadow: 0 6px 20px rgba(127, 0, 255, 0.35);
            margin-top: 5px;
            transition: all 0.1s ease;
        }

        .btn-registration:hover {
            box-shadow: 0 8px 25px rgba(127, 0, 255, 0.5);
            transform: translateY(-2px);
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: max(20px, env(safe-area-inset-top, 25px));
            left: max(20px, env(safe-area-inset-left, 20px));
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            text-decoration: none;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.1s ease;
        }

        .close-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.3);
        }

        /* Adjustments for very small screens */
        @media (max-height: 650px) {
            .video-container {
                height: 52vh;
                width: calc(52vh * (9 / 16));
                margin: 10px auto 0 auto;
            }
            .content-container {
                padding: 15px 15px 20px;
                gap: 8px;
            }
            .fomo-text {
                font-size: 1.15rem;
            }
            .btn {
            padding: 12px 15px;
            font-size: 1.05rem;
        }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
    </style>
</head>
<body>

    <!-- Close Button -->
    <a href="index.html" onclick="if(document.referrer.includes(window.location.hostname) && window.history.length > 1) { window.history.back(); return false; }" class="close-btn" aria-label="חזרה לאתר">✕</a>

    <!-- Animated Background Orbs -->
    <div class="bg-container">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="bg-orb orb-3"></div>
    </div>

    <!-- Main Video Hero -->
    <div class="video-container" style="position: relative;">
        <video id="avigail-vid" playsinline controls>
            <source src="assets/videos/fitness.html.mp4" type="video/mp4">
            דפדפן זה אינו תומך בווידאו.
        </video>
        
        <!-- Play Overlay -->
        <div id="play-overlay" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.65); z-index: 10; cursor: pointer; backdrop-filter: blur(2px);">
            <div style="color: white; font-weight: 900; font-size: 1.6rem; display: flex; flex-direction: column; align-items: center; gap: 12px; animation: pulse 2.5s infinite; text-shadow: 0 4px 20px rgba(0,0,0,0.9); text-align: center;">
                <span style="font-size: 3.5rem; filter: drop-shadow(0 0 15px rgba(255,255,255,0.4)); line-height: 1;">▶️</span>
                <span id="play-text">לחצו לתחילת הסרטון</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('avigail-vid');
            const overlay = document.getElementById('play-overlay');
            const playText = document.getElementById('play-text');
            
            if(overlay && video) {
                overlay.addEventListener('click', function() {
                    video.play();
                    if(window.trackEvent && video.currentTime < 1) window.trackEvent('play_avigail_video');
                });
                
                video.addEventListener('play', function() {
                    overlay.style.display = 'none';
                });
                
                video.addEventListener('pause', function() {
                    overlay.style.display = 'flex';
                    if (playText) {
                        if (video.ended) {
                            playText.innerText = "לחצו לצפייה חוזרת";
                        } else if (video.currentTime > 0) {
                            playText.innerText = "לחצו להמשך הסרטון";
                        } else {
                            playText.innerText = "לחצו לתחילת הסרטון";
                        }
                    }
                });

                // Track when video finishes
                video.addEventListener('ended', function() {
                    if(window.trackEvent) window.trackEvent('finish_watch_avigail_video');
                    overlay.style.display = 'flex';
                    if (playText) playText.innerText = "לחצו לצפייה חוזרת";
                });
            }
        });
    </script>

    <!-- Content & CTA Actions -->
    <div class="content-container">
        
        <div class="badge">
            <span dir="rtl">מספר המקומות מוגבל</span>
            <span class="icon">✨</span>
        </div>

        <!-- Scarcity / FOMO Text -->
        <div class="fomo-text" dir="rtl">
            מהרו להירשם לחוג! 🏃‍♂️🏃‍♀️
        </div>

        <!-- Primary Call-to-Action -->
        <a href="https://roeikatav.co.il/" 
           class="btn btn-registration" 
           target="_blank"
           onclick="if(window.trackEvent) window.trackEvent('click_registration_fitness');">
            פרטים והרשמה
        </a>
    </div>

</body>
</html>
